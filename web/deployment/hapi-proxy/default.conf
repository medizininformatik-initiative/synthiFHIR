server {
  listen 8080;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $hapi http://hapi:8080;

  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  client_max_body_size 0;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 1h;

  location / {
    proxy_pass $hapi;
  }

  location ~ ^/fhir/(swagger-ui/(index\.html)?|api-docs)/?$ {
    proxy_pass $hapi;
    proxy_set_header Host $http_host;
    proxy_set_header Accept-Encoding "";
    sub_filter_types *;
    sub_filter_once off;
    sub_filter 'http://hapi:8080/fhir' '/fhir';
    sub_filter '$scheme://$http_host/fhir' '/fhir';
  }
}
